<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Notes API docs</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; margin: 24px; line-height: 1.45; }
    code { background: #f3f3f3; padding: 1px 4px; }
  </style>
</head>
<body>
  <h1>Notes API</h1>
  <p>Модуль <code>local.notes</code>. Спека: <a href="openapi.yaml">openapi.yaml</a></p>
  <ul>
    <li><code>GET /api/health</code> - проверка</li>
    <li><code>GET /api/notes</code> - список</li>
    <li><code>POST /api/notes</code> - создать</li>
    <li><code>GET /api/notes/{id}</code> - одна заметка</li>
    <li><code>PUT /api/notes/{id}</code> - обновить</li>
    <li><code>DELETE /api/notes/{id}</code> - удалить</li>
  </ul>
</body>
